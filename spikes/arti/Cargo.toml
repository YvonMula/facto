[package]
name = "facto-arti-spike"
version = "0.0.0"
edition = "2021"
publish = false
description = "Spike: can Arti be embedded in the Facto app as a localhost SOCKS proxy? (ADR 0007)"

[dependencies]
arti-client = { version = "0.47", default-features = false, features = ["tokio", "rustls", "onion-service-client", "static-sqlite"] }
tor-rtcompat = { version = "0.47", default-features = false, features = ["tokio", "rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
anyhow = "1"
# Select ring as the only rustls crypto provider (smaller than aws-lc-rs and needs no cmake for Android).
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
